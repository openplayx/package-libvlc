name: openplayx_playback
description: libVLC playback adapter for OpenPlayX, with file format playback tests.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  # Pinned Dart API; Native libraries are built against package-ffmpeg.
  vlc_player:
    path: forks/vlc_player
  openplayx_ffmpeg:
    path: ../ffmpeg-package
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      tvos:
        ffiPlugin: true
